name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # The e2e suite (tenancy registration/RLS/idempotency) talks to real Postgres.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Story 2.3: the reservation suite exercises the atomic-decision scripts
      # against real Valkey (the same image docker-compose runs locally).
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wms:wms@localhost:55432/wms
      VALKEY_URL: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Code review C18: the repo's own pin is the one CI runs.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The e2e suite (tenancy registration/RLS/idempotency) needs the real
      # tables — this job's postgres service starts empty (services are
      # per-job; the `migrations` job's migrate step does not carry over).
      - name: Apply migrations
        run: bun run db:migrate

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Typecheck (incl. tests)
        run: bun run typecheck

      - name: Build (typecheck + emit)
        run: bun run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wms:wms@localhost:55432/wms
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Code review C18: the repo's own pin is the one CI runs.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate

      - name: Round-trip check (schema vs migrations drift guard)
        run: bun run db:verify

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Code review C18: the repo's own pin is the one CI runs.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export OpenAPI document
        run: bun run openapi:export

      - name: Spec drift guard (committed spec matches the code)
        run: git diff --exit-code openapi/

  loadtest-smoke:
    # Frozen T8's smoke pin (review patch P4): the acceptance harness in
    # smoke mode (minutes) against real Postgres + Valkey — the same service
    # shape the lint-and-test job provisions. The harness boots its own app
    # (createApp), rebuilds its template tenant via the suite-db clone, and
    # exits nonzero when any gate (p95, oversells, ledger parity) fails.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wms:wms@localhost:55432/wms
      VALKEY_URL: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Code review C18: the repo's own pin is the one CI runs.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate

      - name: Acceptance smoke (120 s, gates enforced)
        run: bun run loadtest:smoke

  image:
    # Story 6-2a — the production image (decision 10): build it, migrate a
    # fresh database WITH it (the guarded deploy migrator, then the role
    # provisioning — the deploy's own order), run it as the non-superuser app
    # role (A2: readiness must hold under wms_app's grants, not a
    # superuser's), and probe liveness and readiness. Nothing is pushed.
    #
    # Story 6-2c — every Bun claim is proven HERE, in the built image (A20):
    # linux/amd64 (the ECS platform), every container on one docker network,
    # read-only root filesystems (writable: /tmp), and the smoke client
    # (scripts/image-smoke.mjs) itself a container of the image under test.
    #   - ownership: uid != 0, the code root-owned and not writable
    #   - keep-alive: a socket idle 61 s is reused (200, Keep-Alive: timeout=65);
    #     the same smoke must FAIL against a negative-control image patched
    #     to the old 5 s keep-alive (AC1)
    #   - drain: SIGTERM with a request in flight → its 200 echo with
    #     Connection: close, a new connection unanswered, a reused idle socket
    #     closed cleanly, exit 0
    #   - the worker role: /health/worker 200, the API 404, exit 0; no job → 78
    #   - TLS: verify-full against a CI Postgres with a throwaway CA — the
    #     bundled RDS CA and a host outside the SAN refuse; migrate, provision
    #     and the API (both pools) connect and /health/ready answers 200
    runs-on: ubuntu-latest
    env:
      PLATFORM: linux/amd64
      NET: wms-smoke
      OWNER_URL: postgres://wms:wms@pg:5432/wms
      APP_URL: postgres://wms_app:ci-app-password@pg:5432/wms
      AUTH_URL: postgres://wms_auth:ci-auth-password@pg:5432/wms
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (linux/amd64)
        run: docker build --platform "$PLATFORM" -t wms-be:ci .

      - name: Ownership — non-root, the code root-owned and not writable, /tmp writable
        run: |
          docker run --rm --platform "$PLATFORM" --read-only --tmpfs /tmp wms-be:ci sh -ec '
            test "$(id -u)" != "0"
            test "$(stat -c %u /app/src/main.ts)" = "0"
            test "$(stat -c %u /app/certs/rds-global-bundle.pem)" = "0"
            ! test -w /app/src/main.ts
            ! test -w /app/src
            ! touch /app/src/written 2>/dev/null
            touch /tmp/written
            test "$PGSSLROOTCERT" = /app/certs/rds-global-bundle.pem
            echo "uid $(id -u); code root-owned and read-only; /tmp writable"'

      - name: The smoke network — Postgres and Valkey as containers on it
        run: |
          docker network create "$NET"
          docker run -d --name pg --network "$NET" -e POSTGRES_USER=wms -e POSTGRES_PASSWORD=wms -e POSTGRES_DB=wms postgres:18-alpine
          docker run -d --name valkey --network "$NET" valkey/valkey:9.1-alpine
          for _ in $(seq 1 60); do docker exec pg pg_isready -U wms -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          docker exec pg pg_isready -U wms -h 127.0.0.1
          # The smoke client: the image under test, the script mounted read-only.
          # SMOKE_ARGS adds docker options (the drain runs it detached, kept for its logs).
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/smoke" <<'SH'
          #!/bin/sh
          exec docker run ${SMOKE_ARGS:---rm} --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE/scripts/image-smoke.mjs:/smoke/image-smoke.mjs:ro" wms-be:ci bun /smoke/image-smoke.mjs "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/smoke"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Migrate with the image (guarded deploy migrator), then provision the roles — twice
        # Code review C17: every deploy runs both, so the second pass must be a
        # clean no-op (up to date; the grants and passwords re-apply).
        run: |
          for pass in 1 2; do
            echo "── pass $pass"
            docker run --rm --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp \
              -e DATABASE_URL="$OWNER_URL" wms-be:ci bun run db:migrate:deploy
            docker run --rm --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp -e DATABASE_URL="$OWNER_URL" \
              -e WMS_APP_PASSWORD=ci-app-password -e WMS_AUTH_PASSWORD=ci-auth-password \
              wms-be:ci bun run db:provision-roles
          done

      - name: Run the API as wms_app, read-only (no *_POLL_MS — the API task runs no job, C17)
        run: |
          docker run -d --name wms-be --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp \
            -e DATABASE_URL="$APP_URL" -e DATABASE_AUTH_URL="$AUTH_URL" \
            -e VALKEY_URL=redis://valkey:6379/0 \
            -e JWT_SECRET=ci-only-jwt-secret-not-a-real-one \
            -e MFA_ENCRYPTION_KEY=ci-only-mfa-encryption-key-not-a-real-one \
            wms-be:ci

      - name: Smoke — /health and /health/ready
        run: |
          smoke ready http://wms-be:3000
          smoke status http://wms-be:3000/api/v1/health 200 --contains='"status":"ok"'
          smoke status http://wms-be:3000/api/v1/health/ready 200 --contains='"status":"ready"'
          # The api role has no worker health route (A10).
          smoke status http://wms-be:3000/api/v1/health/worker 404

      - name: Keep-alive — a socket idle 61 s is reused (AC1)
        run: smoke keepalive http://wms-be:3000

      - name: Keep-alive negative control — the same smoke FAILS against the old 5 s keep-alive (AC1)
        run: |
          neg="$RUNNER_TEMP/negative"
          mkdir -p "$neg" && tar --exclude=./node_modules --exclude=./.git -cf - . | tar -xf - -C "$neg"
          sed -i.orig 's/HTTP_KEEP_ALIVE_TIMEOUT_MS = 65_000/HTTP_KEEP_ALIVE_TIMEOUT_MS = 5_000/' "$neg/src/app.factory.ts"
          rm "$neg/src/app.factory.ts.orig"
          grep -q 'HTTP_KEEP_ALIVE_TIMEOUT_MS = 5_000' "$neg/src/app.factory.ts"
          docker build --platform "$PLATFORM" -t wms-be:negative "$neg"
          docker run -d --name wms-be-negative --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp \
            -e DATABASE_URL="$APP_URL" -e DATABASE_AUTH_URL="$AUTH_URL" -e VALKEY_URL=redis://valkey:6379/0 \
            -e JWT_SECRET=ci-only-jwt-secret-not-a-real-one -e MFA_ENCRYPTION_KEY=ci-only-mfa-encryption-key-not-a-real-one \
            wms-be:negative
          # --timeout=5 lets the header check pass, so the failure must come from
          # the 61 s reuse probe itself — the property this smoke exists for.
          if out=$(smoke keepalive http://wms-be-negative:3000 --timeout=5 2>&1); then
            echo "$out"; echo "the keepalive smoke PASSED against a 5 s keep-alive — it does not bite"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -Eq 'FAIL: (the server closed the idle socket before 61000 ms|the reused socket after 61000 ms idle)'
          echo "the keepalive smoke failed at the 61 s reuse against the negative control, as it must"
          docker rm -f wms-be-negative

      - name: Drain under Bun — SIGTERM with a request in flight, an idle socket reused (exit 0)
        run: |
          SMOKE_ARGS="-d --name smoke-drain" smoke drain http://wms-be:3000 | sed 's/^/smoke container: /'
          # The smoke prints its marker once the half-sent request and the idle socket are open.
          for _ in $(seq 1 120); do docker logs smoke-drain 2>&1 | grep -q '^SMOKE-SIGNAL-NOW' && break; sleep 0.5; done
          docker logs smoke-drain 2>&1 | grep -q '^SMOKE-SIGNAL-NOW'
          docker kill -s TERM wms-be
          smoke_status=$(docker wait smoke-drain)
          docker logs smoke-drain
          api_status=$(docker wait wms-be)
          echo "smoke exit $smoke_status; API exit $api_status"
          test "$smoke_status" = "0" && test "$api_status" = "0"

      - name: The worker role — /health/worker 200, no API, exit 0; no job enabled → 78 (A6)
        run: |
          docker run -d --name wms-worker --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp \
            -e WMS_PROCESS_ROLE=worker -e OUTBOX_RELAY_POLL_MS=1000 \
            -e DATABASE_URL="$APP_URL" -e DATABASE_AUTH_URL="$AUTH_URL" -e VALKEY_URL=redis://valkey:6379/0 \
            -e JWT_SECRET=ci-only-jwt-secret-not-a-real-one -e MFA_ENCRYPTION_KEY=ci-only-mfa-encryption-key-not-a-real-one \
            wms-be:ci
          smoke ready http://wms-worker:3000
          sleep 3
          smoke status http://wms-worker:3000/api/v1/health/worker 200 --contains='"job":"outbox-relay"'
          smoke status http://wms-worker:3000/api/v1/tenants/me 404
          # The ECS health check command, exactly as 6-2d will configure it.
          docker exec wms-worker bun -e "fetch('http://127.0.0.1:3000/api/v1/health/worker',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker kill -s TERM wms-worker
          test "$(docker wait wms-worker)" = "0"
          set +e
          no_jobs_out=$(docker run --rm --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp \
            -e WMS_PROCESS_ROLE=worker -e DATABASE_URL="$APP_URL" \
            -e MFA_ENCRYPTION_KEY=ci-only-mfa-encryption-key-not-a-real-one wms-be:ci 2>&1)
          no_jobs=$?
          bad_role_out=$(docker run --rm --platform "$PLATFORM" --read-only --tmpfs /tmp -e WMS_PROCESS_ROLE=foo wms-be:ci 2>&1)
          bad_role=$?
          set -e
          echo "no jobs: exit $no_jobs; bad role: exit $bad_role"
          test "$no_jobs" = "78" && test "$bad_role" = "78"
          echo "$no_jobs_out" | grep -q 'Refusing to start: WMS_PROCESS_ROLE=worker, but no job is enabled'
          echo "$bad_role_out" | grep -q 'Refusing to start: WMS_PROCESS_ROLE must be one of api, worker'

      - name: TLS — verify-full against a CI Postgres with a throwaway CA (decision 12, A7)
        run: |
          tls="$RUNNER_TEMP/tls"; mkdir -p "$tls"; cd "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj "/CN=wms-ci-test-ca"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=pg-tls"
          printf 'subjectAltName=DNS:pg-tls\n' > san.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 2 -extfile san.cnf
          chmod 0600 server.key ca.key
          chmod 0644 ca.crt server.crt
          # The server: alias pg-tls is in the SAN, pg-other is not. The key is
          # copied in for the postgres user (uid 70) with mode 0600.
          docker run -d --name pg-tls --network "$NET" --network-alias pg-other \
            -e POSTGRES_USER=wms -e POSTGRES_PASSWORD=wms -e POSTGRES_DB=wms \
            -v "$tls:/tls-src:ro" --entrypoint sh postgres:18-alpine -c \
            'mkdir -p /tls && cp /tls-src/server.crt /tls-src/server.key /tls/ && chown -R postgres:postgres /tls && chmod 0600 /tls/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key'
          for _ in $(seq 1 60); do docker exec pg-tls pg_isready -U wms -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          sleep 2
          run() { docker run --rm --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp -v "$tls/ca.crt:/ci-ca/ca.crt:ro" "$@"; }
          VF='?sslmode=verify-full'
          echo "── the image's default bundle (the RDS CA) does not sign the CI server: refused"
          if out=$(run -e DATABASE_URL="postgres://wms:wms@pg-tls:5432/wms$VF" wms-be:ci bun run db:migrate:deploy 2>&1); then
            echo "connected with the wrong CA"; exit 1
          fi
          echo "$out" | tail -5
          echo "$out" | grep -q UNABLE_TO_VERIFY_LEAF_SIGNATURE
          echo "── a host outside the certificate's SAN: refused"
          if out=$(run -e DATABASE_URL="postgres://wms:wms@pg-other:5432/wms$VF" -e PGSSLROOTCERT=/ci-ca/ca.crt wms-be:ci bun run db:migrate:deploy 2>&1); then
            echo "connected to a host outside the SAN"; exit 1
          fi
          echo "$out" | grep -m3 -E 'Hostname|code'
          echo "$out" | grep -q ERR_TLS_CERT_ALTNAME_INVALID
          echo "── nothing was applied"
          test "$(docker exec pg-tls psql -U wms -d wms -tAc "select count(*) from pg_namespace where nspname = 'drizzle'")" = "0"
          echo "── verify-full with the CI CA (and the strict flag): migrate, provision"
          run -e DATABASE_URL="postgres://wms:wms@pg-tls:5432/wms$VF" -e PGSSLROOTCERT=/ci-ca/ca.crt \
            -e DATABASE_TLS_REQUIRE_VERIFY_FULL=1 wms-be:ci bun run db:migrate:deploy
          run -e DATABASE_URL="postgres://wms:wms@pg-tls:5432/wms$VF" -e PGSSLROOTCERT=/ci-ca/ca.crt \
            -e DATABASE_TLS_REQUIRE_VERIFY_FULL=1 \
            -e WMS_APP_PASSWORD=ci-app-password -e WMS_AUTH_PASSWORD=ci-auth-password wms-be:ci bun run db:provision-roles
          echo "── the API with both pools on verify-full: /health/ready 200"
          docker run -d --name wms-be-tls --platform "$PLATFORM" --network "$NET" --read-only --tmpfs /tmp \
            -v "$tls/ca.crt:/ci-ca/ca.crt:ro" -e PGSSLROOTCERT=/ci-ca/ca.crt -e DATABASE_TLS_REQUIRE_VERIFY_FULL=1 \
            -e DATABASE_URL="postgres://wms_app:ci-app-password@pg-tls:5432/wms$VF" \
            -e DATABASE_AUTH_URL="postgres://wms_auth:ci-auth-password@pg-tls:5432/wms$VF" \
            -e VALKEY_URL=redis://valkey:6379/0 -e JWT_SECRET=ci-only-jwt-secret-not-a-real-one \
            -e MFA_ENCRYPTION_KEY=ci-only-mfa-encryption-key-not-a-real-one wms-be:ci
          smoke ready http://wms-be-tls:3000
          smoke status http://wms-be-tls:3000/api/v1/health/ready 200 --contains='"status":"ready"'
          # Both pools' sessions are TLS.
          docker exec pg-tls psql -U wms -d wms -tAc \
            "select usename, ssl from pg_stat_ssl join pg_stat_activity using (pid) where usename in ('wms_app','wms_auth')" | tee "$tls/sessions"
          grep -q '^wms_app|t' "$tls/sessions" && grep -q '^wms_auth|t' "$tls/sessions" && ! grep -q '|f' "$tls/sessions"
          echo "── a URL that is not verify-full under the strict flag: refused before connecting (78)"
          set +e
          out=$(run -e DATABASE_URL="postgres://wms:wms@pg-tls:5432/wms?sslmode=require" -e DATABASE_TLS_REQUIRE_VERIFY_FULL=1 \
            wms-be:ci bun src/shared/db/migrate-deploy.ts 2>&1)
          strict=$?
          set -e
          echo "$out"
          test "$strict" = "78"
          echo "$out" | grep -q 'Refusing to migrate: DATABASE_TLS_REQUIRE_VERIFY_FULL=1'
          docker kill -s TERM wms-be-tls
          test "$(docker wait wms-be-tls)" = "0"

      - name: Container logs
        if: always()
        run: |
          for c in wms-be wms-be-negative wms-worker wms-be-tls pg-tls; do
            echo "──── $c"; docker logs "$c" 2>&1 | tail -80 || true
          done
