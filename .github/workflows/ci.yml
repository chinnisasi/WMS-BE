name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # The e2e suite (tenancy registration/RLS/idempotency) talks to real Postgres.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Story 2.3: the reservation suite exercises the atomic-decision scripts
      # against real Valkey (the same image docker-compose runs locally).
      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wms:wms@localhost:55432/wms
      VALKEY_URL: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The e2e suite (tenancy registration/RLS/idempotency) needs the real
      # tables — this job's postgres service starts empty (services are
      # per-job; the `migrations` job's migrate step does not carry over).
      - name: Apply migrations
        run: bun run db:migrate

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Typecheck (incl. tests)
        run: bun run typecheck

      - name: Build (typecheck + emit)
        run: bun run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wms:wms@localhost:55432/wms
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate

      - name: Round-trip check (schema vs migrations drift guard)
        run: bun run db:verify

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export OpenAPI document
        run: bun run openapi:export

      - name: Spec drift guard (committed spec matches the code)
        run: git diff --exit-code openapi/
